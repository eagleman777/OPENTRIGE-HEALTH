version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: opentriage_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: opentriage
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  api:
    build: .
    container_name: opentriage_api
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/opentriage
    ports:
      - "8000:8000"
    depends_on:
      - db
    restart: unless-stopped

  caddy:
    image: caddy:2.7-alpine
    container_name: opentriage_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config: